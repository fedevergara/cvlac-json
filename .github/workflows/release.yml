# Publishes to PyPI when a version tag (v1.2.3) is pushed.
# Credentials: none stored here. PyPI "Trusted Publishing" (OpenID Connect) is used; see PUBLISHING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check that the package version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist/*.whl | grep -q -- "-${tag}-" || { echo "wheel version does not match tag ${tag}"; ls dist; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    # The built wheel, installed without the source tree, against the toy CvLAC page (tests/test_juguete.py).
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7      # only for tests/ and the toy page; the package comes from the wheel
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel
        shell: bash
        run: python -m pip install dist/*.whl pytest
      - name: Test the installed package on the toy page
        shell: bash
        env:
          CVLAC_JSON_INSTALLED: "1"
        run: CVLAC_JSON_EXPECTED_VERSION="${GITHUB_REF_NAME#v}" python -m pytest -p no:cacheprovider tests/test_juguete.py

  publish-pypi:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cvlac-json/
    permissions:
      id-token: write           # required by Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # Alternative with an API token instead of Trusted Publishing (see PUBLISHING.md):
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
